- name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "YConnect English Edition (${{ inputs.tag_name || github.ref_name }})"
          target_commitish: ${{ github.sha }}
          overwrite: true
          body: |
            ### Y CONNECT (English Edition) — ${{ inputs.tag_name || github.ref_name }}
            
            * **100% Translated & Synchronized** with the Yaklang English Ecosystem:
              * `professoxrmoriarty/yakit` (Yakit, IRify, Memfit AI)
              * `professoxrmoriarty/yaklang` (Core Engine)
              * `professoxrmoriarty/ytray` (System Tray Manager)
            
            ---
            
            ### Native Desktop Connection & Client Adaptation Center
            macOS utilizes Swift/AppKit, and Windows utilizes C#/WPF. Electron is **not** used.
            
            #### 🛠 Improvements in this Release:
            * **macOS Terminal Selection:** You can now select the default terminal for launching the Agent. Navigate to "Client Adaptation", select an Agent, and choose the "Default Terminal" below the start button. Officially supports macOS Terminal, iTerm2, and Ghostty; kitty, WezTerm, and Alacritty are optional compatible entries (not guaranteed in all environments). It only allows selecting installed terminals and remembers your choice. If the selected terminal is removed, it automatically falls back to macOS Terminal with a prompt.
            * **Consistent Terminal Launch:** "Launch Agent in Terminal" and "Open Dedicated Terminal Only" use the same default terminal setting. Each launch still uses an independent model, working directory, and session credentials.
            * **iTerm2 Integration:** iTerm2 uses the native session file opening method, requiring no additional AppleScript automation authorization; if iTerm2 asks whether to run the session file, please confirm. Unused requests will be safely canceled upon timeout, and you can retry after handling the prompt.
            * **New Terminal Installations:** For newly installed terminals, please open them once according to the macOS prompt before launching a session from Y CONNECT.
            * **WezTerm Behavior:** WezTerm starts an independent process for new sessions and does not hand over launch requests to an already running instance.
            * **Error Handling:** When launching fails, unused sessions are canceled, and their temporary keys are deleted; this does not affect already running sessions. Terminal launch uses the absolute path of the system's `zsh`.
            * **Windows Edge Peek:** Windows screen edge balance peek, slight glow and open/close animation, native drag and edge-snapping.
            * **Management Center:** The Management Center expands the warm gray sidebar by default, retaining the brand and account at the bottom; the client list is aligned, and narrow windows adapt automatically.
            * **Account Overview:** The Account Overview centrally provides Key, model, protocol copy, client adaptation, and common operations.
            * **Widget Interactions:** Widget focus and selected state do not squeeze the layout; copy feedback will not wrap and change height.
            * **Native Client Adapters:** 8 native client adapters, configuration preview, encrypted backup, external change detection, and recovery.
            
            ---
            
            ### 📥 Download & Installation
            
            * **macOS Universal DMG:** macOS 14+, supports Apple Silicon / Intel. Drag into Applications to install.
            * **Windows x64 Installer:** Windows 10/11, .NET Framework 4.8. 
            * **Windows x64 Portable ZIP:** Run `YConnect.exe` after extraction.
            
            Users of v0.5.0 and above can upgrade via "Check for Updates" within the client. For older versions, please download the new installer. Account data and third-party client configurations will be preserved.
            
            ---
            
            ### 📦 Asset Descriptions
            | Asset | Description |
            | :--- | :--- |
            | `YConnect-*-darwin-universal.dmg` | macOS Universal App (Apple Silicon / Intel) |
            | `YConnect-*-windows-x64-setup.exe` | Windows 64-bit Installer |
            | `YConnect-*-windows-x64.zip` | Windows 64-bit Portable Version |
            | `yconnect-english-bundle.zip` / `yconnect-en.zip` | Bundled ecosystem assets & portable resources |
            | `SHA256SUMS.txt` | Checksums for all released assets |
            | `manifest.json` / `appcast-*.xml` | Update manifest files for Sparkle / WinSparkle |
            
          draft: false
          prerelease: false
          files: release-assets/*

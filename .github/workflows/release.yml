name: Release English Edition

on:
  push:
    tags: ['v*-en'] # v*-en tag များ တက်လာသည့်အခါသာ အလိုအလျောက် Run ပါမည်
  workflow_dispatch:

permissions:
  contents: write # Release ထုတ်ရန် Write Permission လိုအပ်ပါသည်

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1. မူရင်း Windows Build ကို ခေါ်ယူမည်
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      sign-release: false # လတ်တလောတွင် Signing ကို ခေတ္တပိတ်ထားပါသည် (လိုအပ်ပါက true ပြောင်းနိုင်သည်)

  # 2. မူရင်း macOS Build ကို ခေါ်ယူမည်
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      sign-release: false

  # 3. macOS နှင့် Windows ဖိုင်များကို စုစည်းပြီး English Edition ပုံစံဖြင့် Release ထုတ်မည်
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: "Download All Built Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: "Verify Downloaded Files"
        run: ls -lh release-assets/

      - name: "Publish GitHub Release (English Edition)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "YConnect English Edition (${{ github.ref_name }})"
          target_commitish: ${{ github.sha }}
          overwrite: true
          body: |
            ### Y CONNECT (English Edition) — ${{ github.ref_name }}
            
            * **100% Translated & Synchronized** with the Yaklang English Ecosystem:
              * `professoxrmoriarty/yakit` (Yakit, IRify, Memfit AI)
              * `professoxrmoriarty/yaklang` (Core Engine)
              * `professoxrmoriarty/ytray` (System Tray Manager)
            
            ---
            
            ### Native Desktop Connection & Client Adaptation Center
            macOS utilizes Swift/AppKit, and Windows utilizes C#/WPF. Electron is **not** used.
            
            #### 🛠 Improvements in this Release:
            * **macOS Terminal Selection:** You can now select the default terminal for launching the Agent. Navigate to "Client Adaptation", select an Agent, and choose the "Default Terminal" below the start button. Officially supports macOS Terminal, iTerm2, and Ghostty.
            * **Consistent Terminal Launch:** "Launch Agent in Terminal" and "Open Dedicated Terminal Only" use the same default terminal setting. Each launch still uses an independent model, working directory, and session credentials.
            * **Windows Edge Peek:** Windows screen edge balance peek, slight glow and open/close animation, native drag and edge-snapping.
            * **Management Center:** The Management Center expands the warm gray sidebar by default, retaining the brand and account at the bottom; the client list is aligned, and narrow windows adapt automatically.
            * **Account Overview:** The Account Overview centrally provides Key, model, protocol copy, client adaptation, and common operations.
            * **Native Client Adapters:** 8 native client adapters, configuration preview, encrypted backup, external change detection, and recovery.
            
            ---
            
            ### 📥 Download & Installation
            
            * **macOS Universal DMG:** macOS 14+, supports Apple Silicon / Intel. Drag into Applications to install.
            * **Windows x64 Installer:** Windows 10/11, .NET Framework 4.8. 
            * **Windows x64 Portable ZIP:** Run `YConnect.exe` after extraction.
            
            Users of v0.5.0 and above can upgrade via "Check for Updates" within the client. For older versions, please download the new installer. Account data and third-party client configurations will be preserved.
            
            ---
            
            ### 📦 Asset Descriptions
            | Asset | Description |
            | :--- | :--- |
            | `YConnect-*-darwin-universal.dmg` | macOS Universal App (Apple Silicon / Intel) |
            | `YConnect-*-windows-x64-setup.exe` | Windows 64-bit Installer |
            | `YConnect-*-windows-x64.zip` | Windows 64-bit Portable Version |
            
          draft: false
          prerelease: false
          files: release-assets/*
